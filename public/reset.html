<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080d"><title>Reiniciando Net4Fun Hub</title></head><body style="margin:0;background:#05080d;color:#eef9ff;font-family:Arial,sans-serif"><div style="max-width:680px;margin:80px auto;padding:24px"><h2>Atualizando Net4Fun Hub</h2><p style="color:#8ca8ba">Limpando os arquivos antigos do aplicativo...</p><div id="status">Aguarde.</div></div><script>(async()=>{try{if("serviceWorker"in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if("caches"in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}localStorage.setItem("net4fun-bootstrap-version","net4fun-v4");document.getElementById("status").textContent="Pronto. Abrindo a versão nova...";setTimeout(()=>location.replace("/?fresh="+Date.now()),500)}catch(e){document.getElementById("status").textContent="Falha ao limpar o cache. Feche o navegador e tente novamente."}})();</script></body></html>
